<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Memory Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef4ff;
  color: #172033;
  padding: 25px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #65728a;
  margin-bottom: 20px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.stat {
  background: white;
  padding: 10px 20px;
  border-radius: 12px;
  font-weight: bold;
  box-shadow: 0 3px 10px #0002;
}

button {
  border: none;
  border-radius: 12px;
  padding: 10px 18px;
  background: #315bea;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  text-align: center;
  min-height: 30px;
  font-weight: bold;
}

.board {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

.card {
  height: 105px;
  perspective: 800px;
  cursor: pointer;
}

.inner {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.35s;
  transform-style: preserve-3d;
}

.card.flipped .inner,
.card.matched .inner {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 10px;

  box-shadow: 0 3px 10px #0002;
  font-weight: bold;
}

.back {
  background: #315bea;
  color: white;
  font-size: 32px;
}

.front {
  background: white;
  transform: rotateY(180deg);
  direction: ltr;
}

.word {
  font-size: 18px;
}

.definition {
  font-size: 14px;
  line-height: 1.3;
}

.card.correct .front {
  background: #b9f5c5;
  border: 3px solid #22a447;
}

.card.wrong .front {
  background: #ffc1c1;
  border: 3px solid #e13b3b;
}

.card.matched {
  cursor: default;
}

@media(max-width: 900px) {
  .board {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media(max-width: 550px) {
  body {
    padding: 10px;
  }

  .board {
    grid-template-columns: repeat(3, 1fr);
  }

  .card {
    height: 115px;
  }

  .word {
    font-size: 15px;
  }

  .definition {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<h1>🧠 English Memory Game</h1>

<div class="subtitle">
מצאו את הזוג: המילה באנגלית + ההגדרה שלה
</div>

<div class="stats">

  <div class="stat">
    ⭐ נקודות:
    <span id="score">0</span>
  </div>

  <div class="stat">
    🎯 זוגות:
    <span id="pairs">0</span>/<span id="total"></span>
  </div>

  <button onclick="newGame()">
    🔄 משחק חדש
  </button>

</div>

<div id="message">
  לחצו על שני קלפים כדי להתחיל!
</div>

<div class="board" id="board"></div>
