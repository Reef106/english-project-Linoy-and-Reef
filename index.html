<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Vocabulary Match</title>

<style>
:root {
  --bg1:#eef6ff;
  --bg2:#f8f2ff;
  --card:#ffffff;
  --text:#1e293b;
  --primary:#6366f1;
  --primary2:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
  --muted:#64748b;
  --shadow:0 14px 40px rgba(51,65,85,.12);
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  font-family:Arial, sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
}

.container {
  max-width:1200px;
  margin:auto;
  padding:28px 18px 50px;
}

header {
  text-align:center;
  margin-bottom:22px;
}

h1 {
  margin:0;
  font-size:clamp(30px,5vw,50px);
}

.subtitle {
  color:var(--muted);
  margin:8px 0 0;
}

.panel {
  background:rgba(255,255,255,.9);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:20px;
}

.hidden {
  display:none !important;
}

.levels {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.level-btn {
  border:0;
  border-radius:18px;
  padding:18px;
  background:white;
  box-shadow:0 7px 20px rgba(0,0,0,.08);
  cursor:pointer;
  font-size:18px;
  font-weight:800;
  transition:.2s;
}

.level-btn:hover {
  transform:translateY(-3px);
}

.level-btn span {
  display:block;
  font-size:13px;
  color:var(--muted);
  font-weight:500;
  margin-top:5px;
}

.instructions {
  line-height:1.6;
  color:#475569;
}

.instructions b {
  color:var(--text);
}

.topbar {
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

.stats {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.stat {
  background:#f8fafc;
  border-radius:14px;
  padding:10px 14px;
  font-weight:700;
}

.control {
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:#e2e8f0;
  cursor:pointer;
  font-weight:700;
}

.progress {
  height:10px;
  background:#e2e8f0;
  border-radius:99px;
  overflow:hidden;
  margin-top:15px;
}

.progress i {
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  transition:.3s;
}

.board {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
}

.card {
  perspective:1000px;
  min-height:145px;
  cursor:pointer;
}

.card-inner {
  position:relative;
  width:100%;
  height:100%;
  min-height:145px;
  transition:transform .45s;
  transform-style:preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
  transform:rotateY(180deg);
}

.face {
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  box-shadow:0 7px 18px rgba(15,23,42,.10);
}

.front {
  background:linear-gradient(145deg,#6366f1,#8b5cf6);
  color:white;
  font-size:36px;
  font-weight:900;
}

.back {
  background:white;
  transform:rotateY(180deg);
  flex-direction:column;
  gap:8px;
}

.word {
  font-size:19px;
  font-weight:900;
}

.definition {
  font-size:15px;
  line-height:1.35;
}

.pos {
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.card.correct .back {
  background:#dcfce7;
  border:3px solid var(--green);
}

.card.wrong .back {
  background:#fee2e2;
  border:3px solid var(--red);
}

.card.matched {
  cursor:default;
}

.message {
  text-align:center;
  font-weight:800;
  min-height:25px;
  margin:15px 0 0;
}

.next {
  display:block;
  margin:20px auto 0;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  color:white;
  border:0;
  border-radius:14px;
  padding:13px 25px;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.final {
  text-align:center;
}

.final h2 {
  font-size:34px;
}

.score-big {
  font-size:58px;
  font-weight:1000;
  color:var(--primary);
}

@media(max-width:850px) {
  .board {
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(max-width:600px) {
  .levels {
    grid-template-columns:1fr;
  }

  .board {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .card,
  .card-inner {
    min-height:125px;
  }

  .front {
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>📚 English Vocabulary Match</h1>
  <p class="subtitle">
    Match each English word with its correct definition.
  </p>
</header>

<section id="home" class="panel">

<h2>Choose
